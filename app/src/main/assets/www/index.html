<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#F3EEF8" />
  <title>GermanMaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div id="app" class="phone">
    <header class="topbar">
      <div class="progress-chip" id="progressChip">
        <span class="progress-level" id="progressLevel">A1</span>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
    </header>

    <main id="main" class="main"></main>

    <button class="float-quote" id="quoteBtn" data-act="toggleSentence" aria-label="Example sentence" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 17h4l2-5V7H5v5h4zm8 0h4l2-5V7h-8v5h4z"/></svg>
    </button>

    <nav class="dock" id="dock" aria-label="Modes">
      <button class="dock-btn active" data-tab="learn" aria-label="Learn">
        <span class="dock-glow"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V6.6A1.6 1.6 0 0 1 5.6 5h3.8A1.6 1.6 0 0 1 11 6.6V19"/><path d="M11 19V8.6A1.6 1.6 0 0 1 12.6 7h5.8A1.6 1.6 0 0 1 20 8.6V19"/><path d="M3 19h18"/></svg>
        <span>Learn</span>
      </button>
      <button class="dock-btn" data-tab="explore" aria-label="Explore">
        <span class="dock-glow"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 8h6M7 12h4"/><path d="M14 16h3l4 5"/><rect x="3" y="4" width="13" height="13" rx="3"/><path d="M16 8.5A6.5 6.5 0 0 1 20 14"/></svg>
        <span>Explore</span>
      </button>
      <button class="dock-btn" data-tab="you" aria-label="You">
        <span class="dock-glow"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 19.2a7.2 7.2 0 0 1 13.6 0"/></svg>
        <span>You</span>
      </button>
    </nav>
  </div>

  <script src="js/curriculum.js"></script>
  <script src="js/store.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/adaptive.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
